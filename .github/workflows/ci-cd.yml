name: Website Firebase Hosting CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Matches the repository default (read-only token); stated explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is a required status check in the branch ruleset.
  build_and_verify:
    name: Build & Verify Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Verify Static Assets
        run: |
          npm run build
          test -f public/index.html

  deploy_firebase_hosting:
    name: Deploy to Firebase Hosting (joinchorus.app)
    needs: build_and_verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check Firebase Secret
        id: check_secret
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHORUS_WEBSITE }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "SECRET_EXISTS=false" >> "$GITHUB_ENV"
            echo "::warning ::FIREBASE_SERVICE_ACCOUNT_CHORUS_WEBSITE secret is missing in GitHub repository secrets. Deployment skipped."
          else
            echo "SECRET_EXISTS=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Firebase Hosting
        if: env.SECRET_EXISTS == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHORUS_WEBSITE }}'
          channelId: live
          projectId: chorus-chat-app
          target: chorus-website
