<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Chorus website: Identity belongs to the conversation. Not the person.</title>
  <desc id="d">Editorial manifesto hero with the Chorus speech-bubble C mark, the headline from joinchorus.app, two speech bubbles, and the thread-scoped names Ash, River, Echo and Stone.</desc>
  <style>
    .bg{fill:#ffffff}.panel{fill:#f9fafb}.bd{stroke:#eaecf0}
    .tx{fill:#111827}.t2{fill:#4b5563}.ac{fill:#58a6ff}
    .bub{fill:#f3f4f6;stroke:#eaecf0}.dot{fill:#9ca3af}.inv{fill:#ffffff}
    .acs{stroke:#58a6ff}.core{stroke:#111827}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    @media (prefers-color-scheme:dark){
      .bg{fill:#121417}.panel{fill:#1a1d21}.bd{stroke:#30363d}
      .tx{fill:#e6edf3}.t2{fill:#9198a1}
      .bub{fill:#22262c;stroke:#30363d}.dot{fill:#6e7681}.inv{fill:#121417}
      .core{stroke:#e6edf3}
    }
  </style>
  <rect class="bg bd" x="1" y="1" width="1198" height="478" rx="20" stroke-width="2"/>
  <!-- brand mark: geometry from public/logo.svg -->
  <g transform="translate(64 44) scale(0.125)">
    <g transform="translate(256 256)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path class="acs" d="M 90 -165 A 185 185 0 1 0 -150 75 L -205 160 L -115 145 A 185 185 0 0 0 90 165" stroke-width="44"/>
      <path class="core" d="M 60 -105 A 120 120 0 1 0 60 105" stroke-width="34"/>
    </g>
  </g>
  <text class="sans t2" x="144" y="96" font-size="22" font-weight="600" letter-spacing="1">CHORUS · WEBSITE &amp; MANIFESTO</text>

  <g class="sans" font-weight="800" font-size="58" letter-spacing="-2">
    <text class="tx" x="64" y="200">Identity belongs</text>
    <text class="tx" x="64" y="268">to the conversation.</text>
    <text class="t2" x="64" y="336">Not the person.</text>
  </g>
  <text class="sans t2" x="64" y="396" font-size="24" font-weight="500">No accounts. No profiles. No algorithms.</text>
  <text class="sans t2" x="64" y="440" font-size="20" font-weight="500">joinchorus.app · early development · MIT</text>

  <!-- speech bubbles (site visual language) -->
  <g>
    <rect class="bub" x="700" y="64" width="300" height="104" rx="52" stroke-width="2"/>
    <circle class="dot" cx="768" cy="116" r="8"/><circle class="dot" cx="812" cy="116" r="8"/><circle class="dot" cx="856" cy="116" r="8"/>
    <rect class="tx" x="836" y="188" width="300" height="104" rx="52"/>
    <rect class="ac" x="884" y="236" width="140" height="8" rx="4"/>
  </g>
  <!-- thread-scoped names -->
  <text class="sans t2" x="700" y="352" font-size="20" font-weight="600">A new name for every conversation</text>
  <g class="sans" font-size="22" font-weight="700" text-anchor="middle">
    <rect class="tx" x="700" y="372" width="80" height="48" rx="24"/>
    <text class="inv" x="740" y="404">Ash</text>
    <text class="ac" x="794" y="404" font-size="24">→</text>
    <rect class="panel bd" x="808" y="372" width="92" height="48" rx="24" stroke-width="2"/>
    <text class="tx" x="854" y="404">River</text>
    <text class="ac" x="914" y="404" font-size="24">→</text>
    <rect class="panel bd" x="928" y="372" width="84" height="48" rx="24" stroke-width="2"/>
    <text class="tx" x="970" y="404">Echo</text>
    <text class="ac" x="1026" y="404" font-size="24">→</text>
    <rect class="panel bd" x="1040" y="372" width="92" height="48" rx="24" stroke-width="2"/>
    <text class="tx" x="1086" y="404">Stone</text>
  </g>
</svg>
