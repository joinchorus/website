<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #090a0f; }
      .border { fill: none; stroke: #1e2638; stroke-width: 2; }
      .card-bg { fill: #131826; stroke: #263147; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: #f0f6fc; letter-spacing: -0.04em; }
      .text-tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; }
      .badge-bg { fill: #ab7fff; fill-opacity: 0.15; stroke: #bc8cff; stroke-width: 1.5; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; fill: #d2a8ff; letter-spacing: 0.05em; }
      .quote-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 500; fill: #e6edf3; line-height: 1.6; }
      .strikethrough { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; font-weight: 600; fill: #f85149; text-decoration: line-through; }
    </style>
  </defs>

  <!-- Outer Background -->
  <rect class="bg" width="1200" height="420" rx="16" />
  <rect class="border" x="1" y="1" width="1198" height="418" rx="15" />

  <!-- Content Container -->
  <g transform="translate(60, 60)">
    <!-- Top Badge -->
    <rect class="badge-bg" x="0" y="0" width="230" height="32" rx="16" />
    <text class="badge-text" x="115" y="21" text-anchor="middle">PRODUCT MANIFESTO &amp; SITE</text>

    <!-- Main Title -->
    <text class="text-title" x="0" y="95">joinchorus.app</text>

    <!-- Subtitle -->
    <text class="text-tagline" x="0" y="135">The official marketing website and philosophy for Chorus.</text>

    <!-- Right-Side Visual Card: Manifesto Card -->
    <g transform="translate(600, 0)">
      <rect class="card-bg" x="0" y="0" width="480" height="280" rx="12" />
      
      <!-- Card Header -->
      <path d="M0 12C0 5.37 5.37 0 12 0H468C474.63 0 480 5.37 480 12V40H0V12Z" fill="#1c2333" />
      <circle cx="20" cy="20" r="6" fill="#ff5f56" />
      <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
      <circle cx="60" cy="20" r="6" fill="#27c93f" />
      <text font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#8b949e" x="80" y="24">manifesto.md</text>

      <!-- Manifesto Principles Preview -->
      <g transform="translate(30, 65)">
        <text class="strikethrough" x="0" y="20">❌ Profiles  ❌ Likes  ❌ Followers  ❌ Algorithms</text>

        <line x1="0" y1="40" x2="420" y2="40" stroke="#263147" stroke-width="1" />

        <text class="quote-text" x="0" y="75">"Chorus is not another social network.</text>
        <text class="quote-text" x="0" y="100">It is a place where conversations matter</text>
        <text class="quote-text" x="0" y="125">more than persistent identities."</text>

        <rect fill="#238636" fill-opacity="0.2" stroke="#3fb950" stroke-width="1" x="0" y="150" width="220" height="30" rx="6" />
        <text font-family="sans-serif" font-size="13" font-weight="700" fill="#3fb950" x="110" y="170" text-anchor="middle">Identity = Conversation</text>
      </g>
    </g>
  </g>
</svg>
